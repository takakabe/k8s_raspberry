name: Temporary EPUBCheck distribution artifact

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out EPUBCheck Ruby wrapper repository
        uses: actions/checkout@v4
        with:
          repository: takahashim/epubcheck-ruby
          ref: master
          path: source
      - name: Verify EPUBCheck 5.3.0 distribution
        shell: bash
        run: |
          set -euo pipefail
          test -f source/jar/epubcheck-5.3.0/epubcheck.jar
          test -d source/jar/epubcheck-5.3.0/lib
          sha256sum source/jar/epubcheck-5.3.0/epubcheck.jar
      - name: Upload EPUBCheck 5.3.0 distribution
        uses: actions/upload-artifact@v4
        with:
          name: epubcheck-5.3.0-distribution
          path: source/jar/epubcheck-5.3.0
          if-no-files-found: error
          retention-days: 1
